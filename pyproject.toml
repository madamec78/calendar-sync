[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calendar-sync"
version = "2.0.0"
description = "Deterministic Google Drive XLSX to per-technician Google Calendar synchronizer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "google-api-python-client>=2.140,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-auth-httplib2>=0.2,<1",
  "itsdangerous>=2.2,<3",
  "python-multipart>=0.0.9,<1",
  "jinja2>=3.1,<4",
  "apscheduler>=3.10,<4",
  "prometheus-client>=0.20,<1",
  "httpx>=0.27,<1",
  "python-json-logger>=2.0,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[project.scripts]
calendar-sync = "calendar_sync.cli:main"

[tool.setuptools.packages.find]
include = ["calendar_sync*"]

[tool.setuptools.package-data]
calendar_sync = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
